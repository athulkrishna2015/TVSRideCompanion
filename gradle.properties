org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
# No workers.max and no daemon=false here. Both were the 2-core budget on one
# specific laptop, and a committed gradle.properties applies to CI as well as
# to that laptop — so the runner was being held to half the parallelism it had,
# for a limit that means nothing anywhere but here. Local builds pass
# --no-daemon --max-workers=2 --no-parallel explicitly instead; see AGENTS.md,
# where those flags are now mandatory rather than advisory.
#
# in-process Kotlin compilation is kept: it avoids spawning a second JVM for the
# compiler daemon, which costs memory on the runner and a core locally.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true