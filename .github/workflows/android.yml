name: Android

# Build every push and PR; attach the APK to a GitHub Release only on a tag or
# a manual dispatch. Publishing a release on every commit to master buries the
# version you actually want to download.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 21, not the runner's default 17 and not 26: AGP 8.7.3 needs 17+, and the
      # toolchain that builds this repo reproducibly is 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No android-actions/setup-android: v3 fails on current runners with
      # "Failed to find package 'tools'" and a sdkmanager exit code 1. The
      # ubuntu image already ships the SDK, so drive sdkmanager directly and
      # locate it rather than trusting a fixed path.
      - name: Locate the Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME"
            ls -la "${ANDROID_HOME}" || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # A debug APK, not the release one. There is no signing key, so
      # assembleRelease yields an unsigned APK that cannot be installed — and a
      # debuggable APK is what lets `adb shell run-as dev.tvsopen` pull the
      # on-device log file, which is the whole debugging story for this project.
      # Unit tests run before the APK is assembled. The protocol layer is plain
      # arithmetic on byte arrays, so these need no device and no emulator —
      # which is exactly why they caught the odometer double-division bug that
      # every on-device smoke test was blind to.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # The central invariant of this project, enforced by the build rather than
      # by a promise: no network, therefore no account, therefore no cloud.
      # A transitive dependency adding INTERNET would silently break it, so fail
      # the build rather than trust review.
      - name: Assert no INTERNET permission
        run: |
          set -euo pipefail
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "::error::INTERNET permission present — the no-account property is broken"
            exit 1
          fi
          echo "OK: no INTERNET permission"

      - name: Verify the BLE and notification permissions are present
        run: |
          set -euo pipefail
          for p in android.permission.BLUETOOTH_CONNECT \
                   android.permission.BLUETOOTH_SCAN \
                   android.permission.POST_NOTIFICATIONS \
                   android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
                   android.permission.RECEIVE_BOOT_COMPLETED; do
            grep -q "$p" permissions.txt || { echo "::error::missing $p"; exit 1; }
          done
          echo "OK: expected BLE permissions present"

      # Guard the exclusions noted in the manifest. Those five exist for caller
      # ID and button gestures, neither of which is implemented, so granting
      # them means taking a call log and a contact list for nothing. If you add
      # caller ID, delete this step in the same commit that adds the permissions.
      - name: Assert caller-ID permissions are absent
        run: |
          set -euo pipefail
          for p in READ_CALL_LOG READ_CONTACTS ANSWER_PHONE_CALLS CALL_PHONE \
                   READ_PHONE_STATE; do
            if grep -q "android.permission.$p" permissions.txt; then
              echo "::error::$p present — read the manifest note before granting it"
              exit 1
            fi
          done
          echo "OK: no caller-ID permissions"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          body: |
            Debug-signed APK, built by GitHub Actions.

            Install with `adb install -r app-debug.apk`, then grant notification
            access so navigation mirroring can read turn-by-turn from your maps
            app.

            This build declares **no** `INTERNET` permission — verified in CI
            against the merged manifest. It talks to the instrument cluster over
            Bluetooth LE only and needs no account.